<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>دخول الإدارة</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{--ink-900:#12172a;--ink-850:#161c33;--ink-800:#1c2340;--ink-700:#2a3358;--paper:#faf6ec;--text-on-dark:#f2eee1;--text-on-dark-dim:#b8bcd6;--honey:#e7a93d;--honey-deep:#c77f14;--danger:#e35b5b;--success:#4caf7d;--radius-s:10px;--radius-m:16px;--radius-l:24px;--shadow-card:0 10px 30px -12px rgba(10,12,25,.45);--font-display:'Aref Ruqaa',serif;--font-ui:'IBM Plex Sans Arabic',system-ui,sans-serif;}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--font-ui);background:radial-gradient(circle at 30% 20%,rgba(231,169,61,.06),transparent 50%),var(--ink-900);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:var(--text-on-dark);}
.login-box{background:var(--ink-850);border:1px solid var(--ink-700);border-radius:var(--radius-l);padding:32px;max-width:420px;width:100%;box-shadow:var(--shadow-card);position:relative;overflow:hidden;}
@media (min-width:480px){.login-box{padding:40px;}}
.login-box::before{content:'';position:absolute;top:-50px;left:-50px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(231,169,61,.12),transparent 70%);pointer-events:none;}
.lock-icon{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--honey),var(--honey-deep));display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:26px;color:#20150a;box-shadow:0 10px 30px -8px rgba(231,169,61,.5);position:relative;}
.login-box h1{font-family:var(--font-display);font-size:26px;margin:0 0 4px;text-align:center;}
@media (min-width:480px){.login-box h1{font-size:28px;}}
.login-box .sub{text-align:center;font-size:13px;color:var(--text-on-dark-dim);margin:0 0 24px;}
.field{margin-bottom:14px;position:relative;}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--text-on-dark-dim);}
.field input{width:100%;padding:13px 44px 13px 14px;border-radius:var(--radius-s);border:1px solid var(--ink-700);background:var(--ink-900);color:var(--text-on-dark);font-size:14px;transition:border-color .15s,box-shadow .15s;}
.field input:focus{outline:none;border-color:var(--honey);box-shadow:0 0 0 3px rgba(231,169,61,.12);}
.field .field-icon{position:absolute;top:38px;right:14px;color:var(--text-on-dark-dim);font-size:14px;pointer-events:none;}
.field .pwd-toggle{position:absolute;top:36px;left:12px;background:none;border:none;color:var(--text-on-dark-dim);font-size:14px;cursor:pointer;padding:6px;width:34px;height:34px;border-radius:var(--radius-s);display:flex;align-items:center;justify-content:center;}
.field .pwd-toggle:hover{background:rgba(255,255,255,.06);color:var(--text-on-dark);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:999px;border:1px solid transparent;font-weight:600;font-size:14px;cursor:pointer;min-height:48px;width:100%;transition:transform .15s,box-shadow .15s;}
.btn-primary{background:linear-gradient(180deg,var(--honey),var(--honey-deep));color:#20150a;box-shadow:0 8px 20px -8px rgba(231,169,61,.55);}
.btn-primary:hover{box-shadow:0 10px 26px -8px rgba(231,169,61,.7);transform:translateY(-1px);}
.btn-primary:active{transform:translateY(0);}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none!important;}
.form-msg{font-size:13px;padding:11px 14px;border-radius:var(--radius-s);margin-bottom:14px;display:none;align-items:flex-start;gap:8px;}
.form-msg.show{display:flex;}
.form-msg.error{background:rgba(227,91,91,.12);color:#ff9d9d;border:1px solid rgba(227,91,91,.3);}
.form-msg.success{background:rgba(76,175,125,.12);color:#8fe3b8;border:1px solid rgba(76,175,125,.3);}
.form-msg i{margin-top:2px;flex-shrink:0;}
.hint-box{margin-top:18px;padding:12px 14px;background:rgba(91,157,227,.08);border:1px solid rgba(91,157,227,.25);border-radius:var(--radius-s);font-size:11.5px;color:var(--text-on-dark-dim);line-height:1.7;}
.hint-box b{color:var(--text-on-dark);}
.hint-box code{font-family:'IBM Plex Mono',monospace;background:rgba(255,255,255,.06);padding:1px 5px;border-radius:4px;font-size:11px;color:var(--honey);direction:ltr;display:inline-block;}
.back-link{text-align:center;margin-top:18px;font-size:12px;color:var(--text-on-dark-dim);}
.back-link a{color:var(--text-on-dark-dim);text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:color .15s;}
.back-link a:hover{color:var(--honey);}
.loading-overlay{position:fixed;inset:0;background:rgba(18,23,42,.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:200;}
.loading-overlay.show{display:flex;}
.loading-overlay .spinner{width:48px;height:48px;border:4px solid rgba(231,169,61,.2);border-top-color:var(--honey);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#toast-host{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;}
.toast{background:var(--ink-800);border:1px solid var(--ink-700);color:var(--text-on-dark);padding:11px 18px;border-radius:999px;font-size:13px;box-shadow:var(--shadow-card);animation:toastIn .2s;text-align:center;max-width:calc(100vw - 40px);}
.toast.success{border-color:rgba(76,175,125,.5);}
.toast.error{border-color:rgba(227,91,91,.5);}
@keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
  <div class="login-box">
    <div class="lock-icon"><i class="fa-solid fa-shield-halved"></i></div>
    <h1>لوحة الإدارة</h1>
    <p class="sub">دخول خاص بالإدارة فقط</p>
    <div class="form-msg" id="msg"></div>
    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" name="email" required placeholder="admin@platform.site" autocomplete="email" value="">
        <i class="fa-solid fa-envelope field-icon"></i>
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">
        <i class="fa-solid fa-lock field-icon"></i>
        <button type="button" class="pwd-toggle" id="pwdToggle" aria-label="إظهار/إخفاء كلمة المرور"><i class="fa-solid fa-eye"></i></button>
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn"><i class="fa-solid fa-right-to-bracket"></i> دخول</button>
    </form>
    <div class="hint-box">
      <b>بيانات الدخول الافتراضية:</b><br>
      البريد: <code>admin@platform.site</code><br>
      كلمة المرور: <code>admin123</code><br>
      <small style="display:block;margin-top:6px;color:var(--text-on-dark-dim);">يمكن تغييرها من الإعدادات أو عبر متغيرات البيئة <code>ADMIN_EMAIL</code> و <code>ADMIN_PASSWORD</code>.</small>
    </div>
    <div class="back-link"><a href="../index.html"><i class="fa-solid fa-arrow-right"></i> العودة للموقع</a></div>
  </div>
  <div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>
  <div id="toast-host"></div>
  <script>

/* ═══════════════ INLINE SITE LIBRARY (shared) ═══════════════ */
const Site = (() => {
  const API_BASE='/.netlify/functions';
  const TOKEN_KEY='platform_token';
  const USER_CACHE_KEY='platform_user_cache';
  const ADMIN_TOKEN_KEY='platform_admin_token';
  const TYPE_COLOR_VAR={'مذكرة':'--tag-note','ملخص':'--tag-summary','درس':'--tag-lesson','بث':'--tag-other','أخرى':'--tag-other'};
  const FILE_TYPE_ICONS={drive:'fa-brands fa-google-drive',youtube:'fa-brands fa-youtube',pdf:'fa-solid fa-file-pdf',image:'fa-solid fa-image',video:'fa-solid fa-film',audio:'fa-solid fa-music',link:'fa-solid fa-link',iframe:'fa-solid fa-code'};
  const FILE_TYPE_LABELS={drive:'Google Drive',youtube:'YouTube',pdf:'ملف PDF',image:'صورة',video:'فيديو',audio:'ملف صوتي',link:'رابط خارجي',iframe:'محتوى مضمّن'};

  const DEMO_IMPL = (() => {
    const K='__platform_demo_db__';
    function load(){try{return JSON.parse(localStorage.getItem(K)||'{}')}catch{return{}}}
    function save(db){localStorage.setItem(K,JSON.stringify(db))}
    function seed(){
      const db=load();
      if(db._seeded) return db;
      db.settings={site_name:'[اسم الموقع]',site_logo:'',site_logo_size:40,hero_title:'منصتك التعليمية — مذكرات وملخصات ودروس',hero_subtitle:'مذكرات وملخصات ودروس وفيديوهات تعليمية، بعضها مجاني للجميع وبعضها حصري للمشتركين — بأسعار رمزية تناسب كل طالب وطالبة.',teacher_name:'المعلّم/ة',site_tagline:'مذكرات · ملخصات · دروس · بثوث',site_description:'منصة تعليمية لمشاركة المذكرات والملخصات والدروس.',theme_color:'#e7a93d',theme_mode:'dark',whatsapp_number:'',instagram_url:'',tiktok_url:'',snapchat_url:'',youtube_url:'',payment_phone:'',payment_phone_owner:'',payment_method_benefit:true,payment_method_vodafone:false,currency:'BHD',allow_individual_purchase:true,allow_subscription:true,marketplace_enabled:true,default_commission_rate:0.20,min_payout_amount:5,max_seller_discount_percent:30,announcement_text:'',announcement_active:false,announcement_color:'#e7a93d',maintenance_mode:false,footer_note:'',admin_email:'admin@platform.site',show_features_section:true,show_steps_section:true,show_reviews_section:true,show_faq_section:true,show_plans_section:true,show_subjects_section:true,show_latest_section:true,show_sellers_section:true,show_stats_section:true,show_individual_section:true,show_bundles_section:true,referral_enabled:true,referral_discount_percent:10,referral_reward_percent:5,custom_css:''};
      db.admins=[{email:'admin@platform.site',password:'admin123',created_at:new Date().toISOString()}];
      db.users=[];db.users_by_email={};db.subjects=[];db.tags=[];db.categories=[];db.materials=[];db.plans=[];db.bundles=[];db.orders=[];db.subscriptions=[];db.purchases=[];db.reviews=[];db.verified_reviews=[];db.qa=[];db.meets=[];db.sellers=[];db.coupons=[];db.payouts=[];db.payout_requests=[];db.notifications=[];db.activity_log=[];
      db._seeded=true;save(db);return db;
    }
    function reset(){localStorage.removeItem(K);return seed();}
    function uid(p='id'){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
    function _cu(db,t){
      if(!t) return null;
      try{const[p]=t.split('.');const pl=JSON.parse(atob(p));
        if(pl.role==='admin') return {id:pl.uid,email:pl.uid,name:'الإدارة',role:'admin',gender:'female'};
        return (db.users||[]).find(u=>u.id===pl.uid)||null;
      }catch(_){return null;}
    }
    function _ca(db,m,me){
      if(!m.is_locked) return {granted:true,reason:'free'};
      if(!me) return {granted:false,reason:'login_required'};
      if(me.role==='admin') return {granted:true,reason:'admin'};
      if(m.seller_id){const s=(db.sellers||[]).find(x=>x.id===m.seller_id);if(s&&s.user_id===me.id) return {granted:true,reason:'owner'};}
      const sub=(db.subscriptions||[]).find(s=>s.user_id===me.id&&s.status==='active'&&new Date(s.expires_at)>new Date());
      if(sub&&(m.access==='subscription'||m.access==='both')) return {granted:true,reason:'subscription'};
      const pur=(db.purchases||[]).find(p=>p.user_id===me.id&&p.material_id===m.id);
      if(pur&&(m.access==='subscription'||m.access==='individual'||m.access==='both')) return {granted:true,reason:'purchase'};
      return {granted:false,reason:'locked'};
    }
    function _notify(db,userId,type,title,body){
      db.notifications=db.notifications||[];
      db.notifications.push({id:uid('n'),user_id:userId,type,title,body,read:false,created_at:new Date().toISOString()});
      save(db);
    }
    function handle(fn,action,payload){
      const db=seed();
      switch(`${fn}:${action}`){
        case 'content:settings': return {settings:{...db.settings,admin_email:undefined}};
        case 'content:subjects': return {subjects:(db.subjects||[]).slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))};
        case 'content:tags': return {tags:(db.tags||[]).slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))};
        case 'content:plans': return {plans:(db.plans||[]).slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))};
        case 'content:reviews': return {reviews:(db.reviews||[]).filter(r=>r.is_visible).slice(0,12)};
        case 'content:verified-reviews': {let list=(db.verified_reviews||[]).filter(r=>r.status==='visible');if(payload.material_id)list=list.filter(r=>r.material_id===payload.material_id);if(payload.seller_id)list=list.filter(r=>r.seller_id===payload.seller_id);return {reviews:list};}
        case 'content:bundles': {let list=(db.bundles||[]).filter(b=>b.is_published!==false&&b.seller_status!=='pending');if(payload.seller_id)list=list.filter(b=>b.seller_id===payload.seller_id);return {bundles:list};}
        case 'content:categories': return {categories:(db.categories||[]).slice()};
        case 'content:public-stats': return {stats:{materials:(db.materials||[]).filter(m=>m.is_published!==false&&!m.girls_only&&(!m.seller_id||m.seller_status==='approved')).length,subjects:(db.subjects||[]).length,reviews:(db.reviews||[]).filter(r=>r.is_visible).length,students:(db.users||[]).length,sellers:(db.sellers||[]).filter(s=>s.status==='approved').length,plans:(db.plans||[]).length,bundles:(db.bundles||[]).filter(b=>b.is_published!==false).length,verified_reviews:(db.verified_reviews||[]).filter(r=>r.status==='visible').length}};
        case 'content:meets': return {meets:(db.meets||[]).filter(m=>!m.scheduled_at||new Date(m.scheduled_at)>new Date(Date.now()-86400000))};
        case 'content:sellers': {
          const approved=(db.sellers||[]).filter(s=>s.status==='approved');
          const materials=db.materials||[];
          return {sellers:approved.map(s=>({id:s.id,display_name:s.display_name,bio:s.bio,profile_image:s.profile_image,subjects:s.subjects,materials_count:materials.filter(m=>m.seller_id===s.id&&m.is_published!==false&&m.seller_status==='approved').length,created_at:s.created_at}))};
        }
        case 'content:seller-profile': {
          const s=(db.sellers||[]).find(x=>x.id===payload.id);
          if(!s||s.status!=='approved') throw new Error('البائع غير موجود.');
          const materials=(db.materials||[]).filter(m=>m.seller_id===s.id&&m.is_published!==false&&m.seller_status==='approved').sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
          return {seller:{id:s.id,display_name:s.display_name,bio:s.bio,profile_image:s.profile_image,subjects:s.subjects,created_at:s.created_at},materials};
        }
        case 'content:validate-coupon': {
          if(!payload.code) return {valid:false,error:'أدخل كود الخصم.'};
          const c=(db.coupons||[]).find(x=>x.code.toLowerCase()===payload.code.toLowerCase().trim()&&x.is_active);
          if(!c) return {valid:false,error:'كود غير صحيح.'};
          if(c.expires_at&&new Date(c.expires_at)<new Date()) return {valid:false,error:'انتهت صلاحية الكود.'};
          if(c.max_uses&&c.used_count>=c.max_uses) return {valid:false,error:'استُنفد هذا الكود.'};
          return {valid:true,coupon:{id:c.id,code:c.code,discount_type:c.discount_type,discount_value:c.discount_value}};
        }
        case 'content:list': {
          let list=(db.materials||[]).slice();
          const me=_cu(db,payload.token);
          if(!me||me.gender!=='female') list=list.filter(m=>!m.girls_only);
          const approvedSellerIds=new Set((db.sellers||[]).filter(s=>s.status==='approved').map(s=>s.id));
          if(!me||me.role!=='admin') {
            list=list.filter(m=>{
              if(m.is_published===false) return false;
              if(m.seller_id){if(!approvedSellerIds.has(m.seller_id)) return false;if(m.seller_status!=='approved') return false;}
              return true;
            });
          }
          if(payload.subject){const s=(db.subjects||[]).find(x=>x.slug===payload.subject);if(s) list=list.filter(m=>m.subject_id===s.id);}
          if(payload.type) list=list.filter(m=>m.type===payload.type);
          if(payload.tag) list=list.filter(m=>(m.tags||[]).includes(payload.tag));
          if(payload.seller_id) list=list.filter(m=>m.seller_id===payload.seller_id);
          if(payload.q){const q=String(payload.q).toLowerCase();list=list.filter(m=>(m.title||'').toLowerCase().includes(q)||(m.description||'').toLowerCase().includes(q)||(m.search_tags||'').toLowerCase().includes(q));}
          list.sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
          const sellersMap={};(db.sellers||[]).forEach(s=>sellersMap[s.id]={id:s.id,display_name:s.display_name,profile_image:s.profile_image});
          list=list.map(m=>({...m,seller:m.seller_id?sellersMap[m.seller_id]:null}));
          return {materials:list};
        }
        case 'content:get': {
          const m=(db.materials||[]).find(x=>x.slug===payload.slug||x.id===payload.id);
          if(!m) throw new Error('المحتوى غير موجود.');
          const me=_cu(db,payload.token);
          const access=_ca(db,m,me);
          m.view_count=(m.view_count||0)+1;save(db);
          const subject=(db.subjects||[]).find(s=>s.id===m.subject_id);
          const materialTags=(m.tags||[]).map(tid=>(db.tags||[]).find(t=>t.id===tid)).filter(Boolean);
          let seller=null;
          if(m.seller_id){const s=(db.sellers||[]).find(x=>x.id===m.seller_id);if(s) seller={id:s.id,display_name:s.display_name,profile_image:s.profile_image,bio:s.bio};}
          const related=(db.materials||[]).filter(x=>x.id!==m.id&&x.subject_id===m.subject_id&&x.is_published!==false&&(!x.seller_id||x.seller_status==='approved')).slice(0,4).map(x=>({id:x.id,title:x.title,slug:x.slug,type:x.type,cover_image_url:x.cover_image_url,is_locked:x.is_locked,individual_price:x.individual_price,currency:x.currency}));
          const safe={...m};
          if(!access.granted){safe.file_url='';safe.extra_attachments=[];}
          return {material:safe,subject,tags:materialTags,access,seller,related};
        }
        case 'auth:register': {
          const{name,email,password,gender,grade}=payload;
          if(!name||!email||!password) throw new Error('يرجى ملء الحقول.');
          if(!gender||!['female','male'].includes(gender)) throw new Error('يرجى اختيار الجنس.');
          if(password.length<6) throw new Error('كلمة المرور 6 أحرف على الأقل.');
          const en=email.toLowerCase().trim();
          if((db.users||[]).find(u=>u.email===en)) throw new Error('البريد مسجّل.');
          const user={id:uid('u'),name:name.trim(),email:en,password,gender,grade:grade||'',role:'member',status:'active',wishlist:[],created_at:new Date().toISOString()};
          db.users=db.users||[];db.users.push(user);save(db);
          const t='demo.'+user.id;const safe={...user};delete safe.password;return {token:t,customer:safe};
        }
        case 'auth:login': {
          const en=(payload.email||'').toLowerCase().trim();
          const user=(db.users||[]).find(u=>u.email===en);
          if(!user||user.password!==payload.password) throw new Error('بيانات الدخول غير صحيحة.');
          if(user.status==='blocked') throw new Error('الحساب محظور.');
          const t='demo.'+user.id;const safe={...user};delete safe.password;return {token:t,customer:safe};
        }
        case 'auth:me': {
          const me=_cu(db,payload.token);
          if(!me||me.role==='admin') throw new Error('انتهت الجلسة.');
          const sub=(db.subscriptions||[]).find(s=>s.user_id===me.id&&s.status==='active'&&new Date(s.expires_at)>new Date());
          const seller=(db.sellers||[]).find(s=>s.user_id===me.id);
          const unread=(db.notifications||[]).filter(n=>n.user_id===me.id&&!n.read).length;
          const safe={...me};delete safe.password;
          return {customer:safe,subscription:sub||null,seller:seller?{id:seller.id,status:seller.status,display_name:seller.display_name}:null,unread_notifications:unread};
        }
        case 'auth:account-summary': {
          const me=_cu(db,payload.token);
          if(!me||me.role==='admin') throw new Error('انتهت الجلسة.');
          const myOrders=(db.orders||[]).filter(o=>o.user_id===me.id);

  let _demoMode=null;
  async function call(fn,payload={}){
    const token=(fn==='admin'?getAdminToken():getToken());
    const body={...payload};
    if(token&&!body.token) body.token=token;
    if(_demoMode===true) return DEMO_IMPL.handle(fn,body.action||'',body);
    let res,json;
    try{res=await fetch(`${API_BASE}/${fn}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});}
    catch(_){_demoMode=true;return DEMO_IMPL.handle(fn,body.action||'',body);}
    if(res.status===404){_demoMode=true;return DEMO_IMPL.handle(fn,body.action||'',body);}
    try{json=await res.json();}catch(_){json={};}
    if(!res.ok) throw new Error(json.error||'حدث خطأ.');
    return json;
  }
  function isDemoMode(){return _demoMode===true;}

  function applySettings(s){
    if(s.theme_color&&s.theme_color!=='#e7a93d'){
      document.documentElement.style.setProperty('--honey',s.theme_color);
      document.documentElement.style.setProperty('--honey-deep',darken(s.theme_color,20));
    }
    if(s.theme_mode==='light') document.body.classList.add('paper-mode');
    // الشعار
    if(s.site_logo){
      document.querySelectorAll('.brand').forEach(brand=>{
        if(brand.querySelector('img.logo')) return; // already applied
        const dot=brand.querySelector('.dot');
        if(dot){
          const img=document.createElement('img');
          img.src=s.site_logo;
          img.className='logo';
          img.alt=s.site_name||'منصة';
          if(s.site_logo_size) img.style.height=s.site_logo_size+'px';
          dot.replaceWith(img);
        }
      });
    }
    // اسم الموقع
    document.querySelectorAll('[data-site]').forEach(el=>{const k=el.getAttribute('data-site');if(s[k]!==undefined&&s[k]!==null&&s[k]!=='') el.textContent=s[k];});
    if(s.announcement_active&&s.announcement_text){
      let bar=document.getElementById('announcement-bar');
      if(!bar){bar=document.createElement('div');bar.id='announcement-bar';document.body.insertBefore(bar,document.body.firstChild);}
      if(s.announcement_color) bar.style.background=`linear-gradient(180deg,${s.announcement_color},${darken(s.announcement_color,20)})`;
      else bar.style.background='linear-gradient(180deg,var(--honey),var(--honey-deep))';
      bar.style.color='#20150a';
      bar.textContent=s.announcement_text;
    }
    // إخفاء الأقسام
    ['subjects','latest','plans','reviews','faq','sellers','stats'].forEach(sec=>{
      if(s['show_'+sec+'_section']===false){const el=document.getElementById(sec+'Section');if(el) el.style.display='none';}
    });
    if(s.custom_css){let st=document.getElementById('custom-css');if(!st){st=document.createElement('style');st.id='custom-css';document.head.appendChild(st);}st.textContent=s.custom_css;}
  }
  function darken(hex,p){const n=parseInt(hex.replace('#',''),16);const r=Math.max(0,(n>>16)-Math.round(255*p/100));const g=Math.max(0,((n>>8)&0xFF)-Math.round(255*p/100));const b=Math.max(0,(n&0xFF)-Math.round(255*p/100));return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');}

  }

  function initHeader(){
    const tg=document.querySelector('.nav-toggle');
    const nv=document.querySelector('.main-nav');
    if(tg&&nv) tg.addEventListener('click',()=>nv.classList.toggle('open'));
    document.querySelectorAll('[data-auth="guest"]').forEach(el=>el.style.display=isLoggedIn()?'none':'');
    document.querySelectorAll('[data-auth="member"]').forEach(el=>el.style.display=isLoggedIn()?'':'none');
    document.querySelectorAll('[data-action="logout"]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();logout();}));
    const cur=window.location.pathname.split('/').pop()||'index.html';
    document.querySelectorAll('.main-nav a, .bottom-nav a').forEach(a=>{a.classList.toggle('active',a.getAttribute('href')===cur);});
    setTimeout(()=>{if(isDemoMode()){const b=document.createElement('div');b.style.cssText='position:fixed;bottom:80px;right:14px;background:#e7a93d;color:#20150a;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:600;z-index:300;';b.innerHTML='<i class="fa-solid fa-flask"></i> معاينة';document.body.appendChild(b);}},1500);
    // عدّاد الإشعارات
    if(isLoggedIn()){
      call('auth',{action:'me'}).then(d=>{
        if(d.unread_notifications>0){
          const notifBtn=document.getElementById('notifBtn');
          if(notifBtn){
            const cnt=document.createElement('span');cnt.className='count';cnt.textContent=d.unread_notifications;
            notifBtn.appendChild(cnt);
          }
        }
      }).catch(()=>{});
    }
  }
  document.addEventListener('DOMContentLoaded',()=>{initHeader();loadSettings();});

  return {
    call,getToken,setToken,clearToken,isLoggedIn,getAdminToken,setAdminToken,clearAdminToken,isAdminLoggedIn,adminLogout,
    cacheUser,cachedUser,logout,requireAuth,requireAdmin,redirectToLogin,loadSettings,applySettings,
    toast,escapeHtml,formatMoney,formatDate,formatDateTime,timeAgo,typeColorVar,fileTypeIcon,fileTypeLabel,stars,fileToBase64,qs,debounce,copyToClipboard,
    trackRecentView,getRecentViews,initHeader,
    isDemoMode,DEMO:DEMO_IMPL,TYPE_COLOR_VAR,FILE_TYPE_ICONS,FILE_TYPE_LABELS,
  };
})();
window.Site=Site;

  </script>
  <script>
  // تهيئة الصفحة
  Site.loadSettings();
  
  // إعادة توجيه إذا كان مسجلاً بالفعل
  if(Site.isAdminLoggedIn()){
    window.location.replace('index.html');
  }

  // إظهار/إخفاء كلمة المرور
  document.getElementById('pwdToggle').addEventListener('click',function(){
    const inp=document.getElementById('password');
    const icon=this.querySelector('i');
    if(inp.type==='password'){inp.type='text';icon.className='fa-solid fa-eye-slash';}
    else{inp.type='password';icon.className='fa-solid fa-eye';}
  });

  // معالجة تسجيل الدخول
  document.getElementById('loginForm').addEventListener('submit',async(e)=>{
    e.preventDefault();
    const msg=document.getElementById('msg');
    const btn=document.getElementById('loginBtn');
    const overlay=document.getElementById('loadingOverlay');
    
    btn.disabled=true;
    btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> جاري الدخول...';
    msg.classList.remove('show','error','success');
    overlay.classList.add('show');
    
    try{
      const email=document.getElementById('email').value.trim();
      const password=document.getElementById('password').value;
      
      if(!email||!password){
        throw new Error('يرجى إدخال البريد وكلمة المرور.');
      }
      
      const res=await Site.call('admin',{action:'login',email,password});
      Site.setAdminToken(res.token);
      
      msg.innerHTML='<i class="fa-solid fa-circle-check"></i> تم تسجيل الدخول بنجاح! جاري التحويل...';
      msg.classList.add('show','success');
      
      setTimeout(()=>{
        // قراءة معامل next إن وُجد
        const params=new URLSearchParams(window.location.search);
        const next=params.get('next');
        window.location.href=next||'index.html';
      },800);
    }catch(err){
      msg.innerHTML='<i class="fa-solid fa-circle-exclamation"></i> '+(err.message||'حدث خطأ غير متوقع.');
      msg.classList.add('show','error');
      btn.disabled=false;
      btn.innerHTML='<i class="fa-solid fa-right-to-bracket"></i> دخول';
      overlay.classList.remove('show');
    }
  });

  // السماح بالضغط على Enter في حقل كلمة المرور
  document.getElementById('password').addEventListener('keypress',(e)=>{
    if(e.key==='Enter') document.getElementById('loginForm').dispatchEvent(new Event('submit'));
  });
  </script>
</body>
</html>
